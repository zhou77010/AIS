[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ais"
description = "Adaptive Investment System: an evidence-based investment decision support system."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "utils.constants.APP_VERSION" }

[tool.setuptools.packages.find]
where = ["."]
include = [
    "analysis*",
    "app*",
    "communication*",
    "config*",
    "contracts*",
    "core*",
    "dashboard*",
    "data*",
    "evidence*",
    "evaluation*",
    "models*",
    "pipeline*",
    "portfolio*",
    "utils*",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# AISException is the base exception name required by the Sprint 1 specification.
"utils/exceptions.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
